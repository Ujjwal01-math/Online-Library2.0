<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rent Book</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f4f4;
        }

        .container{

            width:350px;

            margin:100px auto;

            background:white;

            padding:30px;

            border-radius:10px;

            box-shadow:0px 0px 15px rgba(0,0,0,0.2);

            text-align:center;
        }

        h1{
            margin-bottom:20px;
            color:#333;
        }

        select{

            width:100%;

            padding:12px;

            margin-top:20px;

            border-radius:5px;

            border:1px solid gray;

            font-size:16px;
        }

        button{

            margin-top:25px;

            width:100%;

            padding:12px;

            border:none;

            background:#007bff;

            color:white;

            font-size:16px;

            border-radius:5px;

            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Rent Book</h1>

        <form method="POST">

            {% csrf_token %}

            <select name="renter_type" required>

                <option value="">
                    Select User Type
                </option>

                <option value="student">
                    Student
                </option>

                <option value="professional">
                    Professional
                </option>

            </select>

            <button type="submit">
                Confirm Rent
            </button>

        </form>

    </div>

</body>

</html>
